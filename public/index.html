<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>白日夢冒險王 | 登入</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #2d2d2d; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; width: 300px; }
        h1 { margin-bottom: 20px; color: #4CAF50; }
        .icon { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.15em; }

        input { width: 100%; padding: 10px; margin: 10px 0; border: none; border-radius: 5px; box-sizing: border-box;}
        button { width: 100%; padding: 10px; margin-top: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-login { background: #4CAF50; color: white; }
        .btn-register { background: #555; color: white; }
    </style>
</head>
<body>
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
        <symbol id="icon-rocket" viewBox="0 0 24 24">
            <path d="M5 19L19 5M12 5h7v7" />
        </symbol>
        <symbol id="icon-chart" viewBox="0 0 24 24">
            <path d="M4 21h16" />
            <path d="M6 17v-5" />
            <path d="M12 17v-9" />
            <path d="M18 17v-12" />
        </symbol>
        <symbol id="icon-timer" viewBox="0 0 24 24">
            <circle cx="12" cy="13" r="7" />
            <path d="M12 13V9" />
            <path d="M9 3h6" />
        </symbol>
        <symbol id="icon-list-check" viewBox="0 0 24 24">
            <path d="M9 6h11M9 12h11M9 18h11" />
            <path d="M4 12l2 2 4-4" />
        </symbol>
        <symbol id="icon-book" viewBox="0 0 24 24">
            <path d="M4 5h7a3 3 0 0 1 3 3v11a3 3 0 0 0-3-3H4z" />
            <path d="M20 5h-7a3 3 0 0 0-3 3v11a3 3 0 0 1 3-3h7z" />
        </symbol>
        <symbol id="icon-utensils" viewBox="0 0 24 24">
            <path d="M5 3v8M8 3v8M5 7h3" />
            <path d="M12 3v18" />
            <path d="M17 3v18" />
        </symbol>
        <symbol id="icon-logout" viewBox="0 0 24 24">
            <path d="M3 4h10v16H3z" />
            <path d="M13 12h8" />
            <path d="M17 8l4 4-4 4" />
        </symbol>
        <symbol id="icon-robot" viewBox="0 0 24 24">
            <rect x="4" y="7" width="16" height="12" rx="2" />
            <path d="M12 3v4" />
            <circle cx="9" cy="12" r="1" />
            <circle cx="15" cy="12" r="1" />
        </symbol>
        <symbol id="icon-flame" viewBox="0 0 24 24">
            <path d="M12 3s-4 4-4 8a4 4 0 0 0 8 0c0-4-4-8-4-8z" />
        </symbol>
        <symbol id="icon-refresh" viewBox="0 0 24 24">
            <path d="M20 12a8 8 0 1 0-2.34 5.66" />
            <path d="M20 6v6h-6" />
        </symbol>
        <symbol id="icon-save" viewBox="0 0 24 24">
            <path d="M5 4h11l3 3v13H5z" />
            <path d="M9 4v6h6V4" />
        </symbol>
        <symbol id="icon-camera" viewBox="0 0 24 24">
            <rect x="3" y="7" width="18" height="12" rx="2" />
            <circle cx="12" cy="13" r="3" />
            <path d="M7 7l2-3h6l2 3" />
        </symbol>
        <symbol id="icon-calendar" viewBox="0 0 24 24">
            <rect x="3" y="5" width="18" height="16" rx="2" />
            <path d="M3 9h18M7 3v4M17 3v4" />
        </symbol>
        <symbol id="icon-trash" viewBox="0 0 24 24">
            <path d="M4 7h16" />
            <path d="M9 7V5h6v2" />
            <path d="M8 7l1 12h6l1-12" />
        </symbol>
        <symbol id="icon-plus" viewBox="0 0 24 24">
            <path d="M12 5v14M5 12h14" />
        </symbol>
    </svg>

    <div class="card">
        <h1><svg class="icon" aria-hidden="true"><use href="#icon-rocket"></use></svg> 追夢系統</h1>
        <input type="text" id="username" placeholder="帳號">
        <input type="password" id="password" placeholder="密碼">
        <button class="btn-login" onclick="doLogin()">登入</button>
        <button class="btn-register" onclick="doRegister()">註冊新帳號</button>
    </div>

    <script>
        async function doRegister() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            const data = await res.json();
            alert(data.message);
        }

        async function doLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            const data = await res.json();
            
            if(data.success) {
                // 這裡就是傳送門！登入成功後跳轉到儀表板
                window.location.href = '/dashboard.html';
            } else {
                alert(data.message);
            }
        }
    </script>
</body>
</html>
