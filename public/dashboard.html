<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>白日夢冒險王 | 儀表板</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 250px; background: #2d2d2d; padding: 20px; display: flex; flex-direction: column; }
        .menu-item { padding: 15px; color: #aaa; cursor: pointer; border-radius: 5px; margin-bottom: 5px; transition: 0.3s; display: flex; align-items: center; gap: 10px;}
        .menu-item:hover, .menu-item.active { background: #4CAF50; color: white; }
        .main { flex: 1; padding: 40px; overflow-y: auto; }
        .section { display: none; animation: fadeIn 0.5s; }
        .section.active { display: block; }
        .card { background: #2d2d2d; padding: 25px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn { padding: 10px 15px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-green { background: #4CAF50; color: white; width: 100%; }
        .btn-red { background: #ff6b6b; color: white; font-size: 12px; padding: 5px 10px; margin-left: auto; }
        
        .date-header { color: #4CAF50; margin-top: 20px; border-bottom: 1px solid #444; padding-bottom: 5px; font-weight: bold; }
        .todo-item { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #333; }
        .todo-item input[type="checkbox"] { transform: scale(1.3); margin-right: 10px; cursor: pointer; }
        .todo-item.completed span { text-decoration: line-through; color: #666; }
        .butler-box { background: #2a3b2a; border-left: 5px solid #4CAF50; padding: 20px; margin-top: 20px; border-radius: 5px; }

        .icon { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.15em; }
        .menu-item .icon { flex-shrink: 0; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
        <symbol id="icon-rocket" viewBox="0 0 24 24">
            <path d="M5 19L19 5M12 5h7v7" />
        </symbol>
        <symbol id="icon-chart" viewBox="0 0 24 24">
            <path d="M4 21h16" />
            <path d="M6 17v-5" />
            <path d="M12 17v-9" />
            <path d="M18 17v-12" />
        </symbol>
        <symbol id="icon-timer" viewBox="0 0 24 24">
            <circle cx="12" cy="13" r="7" />
            <path d="M12 13V9" />
            <path d="M9 3h6" />
        </symbol>
        <symbol id="icon-list-check" viewBox="0 0 24 24">
            <path d="M9 6h11M9 12h11M9 18h11" />
            <path d="M4 12l2 2 4-4" />
        </symbol>
        <symbol id="icon-book" viewBox="0 0 24 24">
            <path d="M4 5h7a3 3 0 0 1 3 3v11a3 3 0 0 0-3-3H4z" />
            <path d="M20 5h-7a3 3 0 0 0-3 3v11a3 3 0 0 1 3-3h7z" />
        </symbol>
        <symbol id="icon-utensils" viewBox="0 0 24 24">
            <path d="M5 3v8M8 3v8M5 7h3" />
            <path d="M12 3v18" />
            <path d="M17 3v18" />
        </symbol>
        <symbol id="icon-logout" viewBox="0 0 24 24">
            <path d="M3 4h10v16H3z" />
            <path d="M13 12h8" />
            <path d="M17 8l4 4-4 4" />
        </symbol>
        <symbol id="icon-robot" viewBox="0 0 24 24">
            <rect x="4" y="7" width="16" height="12" rx="2" />
            <path d="M12 3v4" />
            <circle cx="9" cy="12" r="1" />
            <circle cx="15" cy="12" r="1" />
        </symbol>
        <symbol id="icon-flame" viewBox="0 0 24 24">
            <path d="M12 3s-4 4-4 8a4 4 0 0 0 8 0c0-4-4-8-4-8z" />
        </symbol>
        <symbol id="icon-refresh" viewBox="0 0 24 24">
            <path d="M20 12a8 8 0 1 0-2.34 5.66" />
            <path d="M20 6v6h-6" />
        </symbol>
        <symbol id="icon-save" viewBox="0 0 24 24">
            <path d="M5 4h11l3 3v13H5z" />
            <path d="M9 4v6h6V4" />
        </symbol>
        <symbol id="icon-camera" viewBox="0 0 24 24">
            <rect x="3" y="7" width="18" height="12" rx="2" />
            <circle cx="12" cy="13" r="3" />
            <path d="M7 7l2-3h6l2 3" />
        </symbol>
        <symbol id="icon-calendar" viewBox="0 0 24 24">
            <rect x="3" y="5" width="18" height="16" rx="2" />
            <path d="M3 9h18M7 3v4M17 3v4" />
        </symbol>
        <symbol id="icon-trash" viewBox="0 0 24 24">
            <path d="M4 7h16" />
            <path d="M9 7V5h6v2" />
            <path d="M8 7l1 12h6l1-12" />
        </symbol>
        <symbol id="icon-plus" viewBox="0 0 24 24">
            <path d="M12 5v14M5 12h14" />
        </symbol>
    </svg>


    <div class="sidebar">
        <h2 style="color:#4CAF50; text-align:center;"><svg class="icon" aria-hidden="true"><use href="#icon-rocket"></use></svg> 追夢總部</h2>
        <div class="menu-item active" onclick="nav('dashboard', this)"><svg class="icon" aria-hidden="true"><use href="#icon-chart"></use></svg> AI 總覽中心</div>
        <div class="menu-item" onclick="nav('pomodoro', this)"><svg class="icon" aria-hidden="true"><use href="#icon-timer"></use></svg> 專注計時</div>
        <div class="menu-item" onclick="nav('todo', this)"><svg class="icon" aria-hidden="true"><use href="#icon-list-check"></use></svg> 日期待辦清單</div>
        <div class="menu-item" onclick="nav('diary', this)"><svg class="icon" aria-hidden="true"><use href="#icon-book"></use></svg> 冒險日記</div>
        <div class="menu-item" onclick="nav('meal', this)"><svg class="icon" aria-hidden="true"><use href="#icon-utensils"></use></svg> AI 飲食分析</div>
        <div class="menu-item" style="margin-top:auto; color:#ff6b6b;" onclick="logout()"><svg class="icon" aria-hidden="true"><use href="#icon-logout"></use></svg> 登出系統</div>
    </div>

    <div class="main">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
            <h1>歡迎回來，冒險者！</h1>
            <span id="today-date"></span>
        </div>

        <div id="dashboard" class="section active">
            <div class="card butler-box">
                <h3 style="margin-top:0;"><svg class="icon" aria-hidden="true"><use href="#icon-robot"></use></svg> AI 管家分析報告</h3>
                <p id="butler-advice" style="font-size: 18px; line-height: 1.6;">正在讀取數據...</p>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                <div class="card" style="text-align:center;">
                    <h3 style="color:#888;"><svg class="icon" aria-hidden="true"><use href="#icon-flame"></use></svg> 今日熱量</h3>
                    <div id="dash-cals" style="font-size:48px; color:#ff6b6b; font-weight:bold;">0</div>
                    <span>kcal</span>
                </div>
                <div class="card" style="text-align:center;">
                    <h3 style="color:#888;"><svg class="icon" aria-hidden="true"><use href="#icon-timer"></use></svg> 總專注時間</h3>
                    <div id="dash-focus" style="font-size:48px; color:#4CAF50; font-weight:bold;">0</div>
                    <span>分鐘</span>
                </div>
            </div>
            <button class="btn btn-green" onclick="loadButler()"><svg class="icon" aria-hidden="true"><use href="#icon-refresh"></use></svg> 重新整理總覽</button>
        </div>

        <div id="pomodoro" class="section">
            <div class="card" style="text-align:center;">
                <h3><svg class="icon" aria-hidden="true"><use href="#icon-timer"></use></svg> 深度工作區</h3>
                <div id="timer" style="font-size:80px; font-weight:bold; color:#4CAF50; margin:30px 0;">25:00</div>
                <div style="display:flex; gap:10px; justify-content:center;">
                    <button class="btn btn-green" style="width:120px;" onclick="startTimer()">開始</button>
                    <button class="btn btn-red" style="width:120px; background:#ff6b6b;" onclick="pauseTimer()">暫停</button>
                    <button class="btn" style="width:120px; background:#444; color:white;" onclick="resetTimer()">重置</button>
                </div>
            </div>
        </div>

        <div id="todo" class="section">
            <div class="card">
                <h3><svg class="icon" aria-hidden="true"><use href="#icon-list-check"></use></svg> 新增任務</h3>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="new-task" placeholder="輸入任務..." style="flex:1; padding:10px;">
                    <input type="date" id="new-task-date" style="padding:10px; background:#333; color:white; border:none; border-radius:5px;">
                    <button class="btn btn-green" style="width:100px;" onclick="addTodo()">加入</button>
                </div>
            </div>
            <div id="todo-list-container" class="card"></div>
        </div>

        <div id="diary" class="section">
            <div class="card">
                <h3><svg class="icon" aria-hidden="true"><use href="#icon-book"></use></svg> 寫日記 (AI 這次一定會回你)</h3>
                <textarea id="diary-content" style="width:100%; height:100px; background:#1a1a1a; color:white; border:1px solid #444; padding:10px;" placeholder="寫下心情..."></textarea>
                <button class="btn btn-green" onclick="saveDiary()"><svg class="icon" aria-hidden="true"><use href="#icon-save"></use></svg> 保存並分析</button>
            </div>
            <div id="diary-history"></div>
        </div>

        <div id="meal" class="section">
            <div class="card">
                <h3><svg class="icon" aria-hidden="true"><use href="#icon-utensils"></use></svg> AI 飲食分析 (圖片指紋辨識)</h3>
                <div onclick="document.getElementById('meal-input').click()" style="border:2px dashed #666; padding:20px; text-align:center; cursor:pointer;"><svg class="icon" aria-hidden="true"><use href="#icon-camera"></use></svg> 上傳照片 (上傳後自動分析並存檔)</div>
                <input type="file" id="meal-input" accept="image/*" style="display:none" onchange="uploadAndAnalyze(this)">
            </div>
            <div id="meal-history"></div>
        </div>
    </div>

    <script>
        document.getElementById('today-date').innerText = new Date().toLocaleDateString();
        document.getElementById('new-task-date').valueAsDate = new Date();

        // 登入檢查
        async function check(res) {
            if(res.status === 401) { alert('請重新登入'); window.location.href = '/'; throw new Error('Auth'); }
            return res;
        }

        async function init() {
            loadButler(); loadTodo(); loadDiary(); loadMeal();
        }

        // --- 1. AI 總覽 ---
        async function loadButler() {
            try {
                let res = await fetch('/api/butler').then(check);
                let data = await res.json();
                document.getElementById('butler-advice').innerText = data.advice;
                document.getElementById('dash-cals').innerText = data.totalCals;
                document.getElementById('dash-focus').innerText = data.focusTime;
            } catch(e) {}
        }

        // --- 2. 待辦 (修正日期顯示) ---
        async function addTodo() {
            const task = document.getElementById('new-task').value;
            const date = document.getElementById('new-task-date').value; // 取得 YYYY-MM-DD
            if(!task) return;
            await fetch('/api/todo', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ task, date }) }).then(check);
            document.getElementById('new-task').value = '';
            loadTodo();
        }
        async function toggleTodo(id, cb) {
            await fetch('/api/todo/toggle', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ id, completed: cb.checked }) }).then(check);
            loadTodo();
        }
        async function deleteTodo(id) {
            if(!confirm('刪除？')) return;
            await fetch('/api/todo/delete', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ id }) }).then(check);
            loadTodo();
        }
        async function loadTodo() {
            let res = await fetch('/api/todo').then(check);
            let todos = await res.json();
            const grouped = {};
            todos.forEach(t => { if(!grouped[t.date]) grouped[t.date] = []; grouped[t.date].push(t); });
            
            let html = '';
            Object.keys(grouped).sort().forEach(date => {
                html += `<div class="date-header"><svg class="icon" aria-hidden="true"><use href="#icon-calendar"></use></svg> ${date}</div>`;
                grouped[date].forEach(t => {
                    html += `
                        <div class="todo-item ${t.completed ? 'completed' : ''}">
                            <input type="checkbox" onclick="toggleTodo(${t.id}, this)" ${t.completed ? 'checked' : ''}>
                            <span style="flex:1;">${t.task}</span>
                            <button class="btn-red" onclick="deleteTodo(${t.id})"><svg class="icon" aria-hidden="true"><use href="#icon-trash"></use></svg></button>
                        </div>`;
                });
            });
            document.getElementById('todo-list-container').innerHTML = html || '無任務';
            loadButler(); // 更新總覽
        }

        // --- 3. 日記 (修正 undefined) ---
        async function saveDiary() {
            const content = document.getElementById('diary-content').value;
            if(!content) return;
            let res = await fetch('/api/diary', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ content }) }).then(check);
            let data = await res.json();
            alert('AI 回應：\n' + data.aiResponse);
            document.getElementById('diary-content').value = '';
            loadDiary();
        }
        async function deleteDiary(id) {
            if(!confirm('刪除？')) return;
            await fetch('/api/diary/delete', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ id }) }).then(check);
            loadDiary();
        }
        async function loadDiary() {
            let res = await fetch('/api/diary').then(check);
            let data = await res.json();
            document.getElementById('diary-history').innerHTML = data.map(d => `
                <div class="card" style="padding:15px; margin-bottom:10px;">
                    <div style="display:flex; justify-content:space-between;">
                        <span style="color:#888; font-size:12px;">${d.date}</span>
                        <button class="btn-red" onclick="deleteDiary(${d.id})"><svg class="icon" aria-hidden="true"><use href="#icon-trash"></use></svg></button>
                    </div>
                    <div style="margin:5px 0;">${d.content}</div>
                    <div style="background:#2a3b2a; padding:10px; border-radius:5px; color:#4CAF50;"><svg class="icon" aria-hidden="true"><use href="#icon-robot"></use></svg> ${d.aiResponse}</div>
                </div>`).join('');
            loadButler();
        }

        // --- 4. 飲食 (修正不一致) ---
        async function uploadAndAnalyze(input) {
            if(input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    const image = e.target.result; // Base64
                    // 直接送去後端分析並存檔
                    let res = await fetch('/api/meal', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ image })
                    }).then(check);
                    let data = await res.json();
                    alert(`分析完成！\n熱量: ${data.nutrients.calories} kcal`);
                    loadMeal();
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
        async function deleteMeal(id) {
            if(!confirm('刪除？')) return;
            await fetch('/api/meal/delete', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ id }) }).then(check);
            loadMeal();
        }
        async function loadMeal() {
            let res = await fetch('/api/meal').then(check);
            let data = await res.json();
            document.getElementById('meal-history').innerHTML = data.map(m => `
                <div class="card" style="padding:15px; margin-bottom:10px;">
                    <div style="display:flex; justify-content:space-between;">
                        <span style="color:#888; font-size:12px;">${m.date}</span>
                        <button class="btn-red" onclick="deleteMeal(${m.id})"><svg class="icon" aria-hidden="true"><use href="#icon-trash"></use></svg></button>
                    </div>
                    <div style="font-size:20px; font-weight:bold; color:#4CAF50;"><svg class="icon" aria-hidden="true"><use href="#icon-flame"></use></svg> ${m.nutrients.calories} kcal</div>
                    <div style="color:#aaa; font-size:12px;">P:${m.nutrients.protein}g / F:${m.nutrients.fat}g / C:${m.nutrients.carb}g</div>
                </div>`).join('');
            loadButler();
        }

        // --- 5. 專注計時 (25分鐘) ---
        let timer, timeLeft = 25 * 60, isRunning = false;
        function updateDisplay() {
            let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            let s = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${m}:${s}`;
        }
        function startTimer() {
            if(isRunning) return; isRunning = true;
            timer = setInterval(() => {
                if(timeLeft > 0) { timeLeft--; updateDisplay(); } 
                else { 
                    clearInterval(timer); alert('專注完成！'); 
                    fetch('/api/focus', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({minutes:25})}).then(check);
                    resetTimer();
                }
            }, 1000);
        }
        function pauseTimer(){ clearInterval(timer); isRunning = false; }
        function resetTimer(){ pauseTimer(); timeLeft=25*60; updateDisplay(); }

        function nav(id, btn) {
            document.querySelectorAll('.section').forEach(e=>e.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.menu-item').forEach(e=>e.classList.remove('active'));
            btn.classList.add('active');
        }
        async function logout() { await fetch('/api/logout', {method:'POST'}); window.location.href='/'; }

        init(); // 啟動載入
    </script>
</body>
</html>
